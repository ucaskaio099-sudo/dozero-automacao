name: Publicar Instagram Diário

on:
  schedule:
    # Rodar a cada 30 min no horário BR (UTC-3) → 06:30-23:30 BR
    # Meta Business Suite não aceita agendamento > 75 dias, mas a API aceita.
    - cron: "*/30 9-2 * * *"  # 06:30-23:30 BR = 09:30-02:30 UTC
  workflow_dispatch:
    inputs:
      post:
        description: "Post ID específico (pode repetir)"
        required: false
      dry_run:
        description: "Simular sem publicar"
        type: boolean
        default: true
      incluir_atrasados:
        description: "Incluir posts fora da janela"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TIMEZONE: America/Sao_Paulo
  POST_WINDOW_HOURS: 24
  MEDIA_POLL_SECONDS: 10
  MEDIA_POLL_TIMEOUT_SECONDS: 600
  META_HTTP_TIMEOUT_SECONDS: 60
  META_GRAPH_API_VERSION: v25.0
  DRY_RUN: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar artes faltantes
        run: python scripts/gerar_arte.py

      - name: Preparar variáveis de ambiente
        run: |
          echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" >> $GITHUB_ENV
          echo "INSTAGRAM_BUSINESS_ACCOUNT_ID=${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" >> $GITHUB_ENV
          echo "PUBLIC_MEDIA_BASE_URL=${{ secrets.PUBLIC_MEDIA_BASE_URL }}" >> $GITHUB_ENV
          echo "META_APP_SECRET=${{ secrets.META_APP_SECRET }}" >> $GITHUB_ENV
          # Override DRY_RUN se for workflow_dispatch com dry_run=false
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            echo "DRY_RUN=false" >> $GITHUB_ENV
          fi

      - name: Publicar posts vencidos
        id: publicar
        run: |
          ARGS=()
          if [ "${{ github.event.inputs.post }}" != "" ]; then
            for p in ${{ github.event.inputs.post }}; do
              ARGS+=(--post "$p")
            done
          fi
          if [ "${{ github.event.inputs.incluir_atrasados }}" = "true" ]; then
            ARGS+=(--incluir-atrasados)
          fi
          python scripts/publicar.py "${ARGS[@]}"
        shell: bash

      - name: Commit calendário atualizado
        if: always() && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet conteudo/calendario.csv conteudo/estado_publicacao.json; then
            git add conteudo/calendario.csv conteudo/estado_publicacao.json
            git commit -m "chore: atualiza status de publicação [skip ci]"
            git push
          else
            echo "Nenhuma mudança no calendário/estado para commitar"
          fi

      - name: Notificar falha (opcional)
        if: failure()
        run: |
          echo "::warning::Publicação falhou. Verifique os logs."
          # Aqui você pode adicionar webhook Discord/Slack/email se quiser