name: Publicar Instagram Diário

on:
  schedule:
    # 06:30–23:30 America/Sao_Paulo ≈ 09:30–02:30 UTC
    - cron: "7,37 9-23,0-2 * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "Post ID específico (pode repetir)"
        required: false
      dry_run:
        description: "Simular sem publicar"
        type: boolean
        default: false
      incluir_atrasados:
        description: "Incluir posts fora da janela"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TIMEZONE: America/Sao_Paulo
  POST_WINDOW_HOURS: "48"
  MEDIA_POLL_SECONDS: "10"
  MEDIA_POLL_TIMEOUT_SECONDS: "600"
  META_HTTP_TIMEOUT_SECONDS: "60"
  META_GRAPH_API_VERSION: v25.0
  DRY_RUN: "false"

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar artes faltantes
        run: python scripts/gerar_arte.py

      - name: Variáveis
        run: |
          echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" >> "$GITHUB_ENV"
          echo "INSTAGRAM_BUSINESS_ACCOUNT_ID=${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}" >> "$GITHUB_ENV"
          echo "FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" >> "$GITHUB_ENV"
          echo "PUBLIC_MEDIA_BASE_URL=${{ secrets.PUBLIC_MEDIA_BASE_URL }}" >> "$GITHUB_ENV"
          echo "META_APP_SECRET=${{ secrets.META_APP_SECRET }}" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          fi

      - name: Publicar
        run: |
          set -e
          ARGS=(--limite 3)
          if [ -n "${{ github.event.inputs.post }}" ]; then
            for p in ${{ github.event.inputs.post }}; do
              ARGS+=(--post "$p")
            done
          fi
          if [ "${{ github.event.inputs.incluir_atrasados }}" != "false" ]; then
            ARGS+=(--incluir-atrasados)
          fi
          python scripts/publicar.py "${ARGS[@]}"
        shell: bash

      - name: Commit calendário e mídia
        if: always() && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f midia/ || true
          git add conteudo/calendario.csv conteudo/estado_publicacao.json || true
          if git diff --cached --quiet; then
            echo "Nada para commitar"
          else
            git commit -m "chore: publicação / artes [skip ci]"
            git push
          fi
