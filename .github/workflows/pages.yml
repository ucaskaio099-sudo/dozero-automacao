name: GitHub Pages (mídia pública)

# O Instagram só baixa JPEG/MP4 de URL HTTPS. Esta Action publica a pasta midia/.

on:
  push:
    branches: [main, master]
    paths:
      - "midia/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar site estático
        run: |
          mkdir -p docs
          if [ -d midia ]; then cp -a midia docs/midia; fi
          printf '<!doctype html><title>dozero midia</title>' > docs/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
