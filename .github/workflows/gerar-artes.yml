name: Gerar Artes (quando calendario muda)

on:
  push:
    paths:
      - 'conteudo/calendario.csv'
      - 'scripts/gerar_arte.py'
      - 'scripts/marca.py'
      - 'scripts/comum.py'
      - 'config.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar deps
        run: pip install -r requirements.txt

      - name: Gerar artes
        run: python scripts/gerar_arte.py --refazer

      - name: Commit mídias geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet midia/; then
            git add midia/
            git commit -m "chore: regenera artes do calendário [skip ci]"
            git push
          else
            echo "Nenhuma arte nova"
          fi